<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Drill 2</title>
    <style>
body
{
    font-family:'Times New Roman', Times, serif;
    text-align: center;
    background-color: #b283a1;

}
section{
width: 100%;
text-align: center;
border-radius: 10px;
max-width: auto;

input[type="submit"], select, textarea {
padding: 10px;
margin: 10px;
max-width: 600px;
border-radius: 10px;
box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

img {
    display: block;
    margin: 0 auto;
    height: 100px;
    width: 100px;
    padding: 10px;
}
    
}

</style>
</head>
<body>
    <header>
        <h1>Rate A Movie</h1>
        <br>
    <p>Say something about the content.</p>
     </header>

     <section>
        <form action="#">
        <img src="https://www.pngkey.com/png/detail/825-8250052_film-logo-design-ideas.png" alt="Movie poster">
        <label for="movies">Select a Movie</label>
        <select id="movies">
            <option value="">Please select a movie</option>
            <option value="m1">Unfriended: Dark Web</option>
            <option value="m2">Weapons</option>
            <option value="m3">Five Nights at Freddy's 2</option>
            <option value="m4">Spider-Man: Across the Spider-Verse</option>
        </select>
<label for="genres">Genre/s</label>

<input type="checkbox" id="genre 1" name="genre 1" value="Animation">
<label for="genre 1">Animation</label>

<input type="checkbox" id="genre 2" name="genre 2" value="Family">
<label for="genre 2">Family</label>

<input type="checkbox" id="genre 3" name="genre 3" value="Technology">
<label for="genre 3">Technology</label>

<input type="checkbox" id="genre 4" name="genre 4" value="Action">
<label for="genre 4">Action</label>

<input type="checkbox" id="genre 5" name="genre 5" value="Horror">
<label for="genre 5">Horror</label>
<br>
<br>
<label for="rate">Genre/s</label>
<br>
<input type="radio" id="rate1" name="rating" value="🌟">
<label for="rate1">🌟</label>

<input type="radio" id="rate2" name="rating" value="🌟🌟">
<label for="rate2">🌟🌟</label>

<input type="radio" id="rate3" name="rating" value="🌟🌟🌟">
<label for="rate3">🌟🌟🌟</label>

<input type="radio" id="rate4" name="rating" value="🌟🌟🌟🌟">
<label for="rate4">🌟🌟🌟🌟</label>

<input type="radio" id="rate5" name="rating" value="🌟🌟🌟🌟🌟">
<label for="rate5">🌟🌟🌟🌟🌟</label>
<br><br>
<textarea id="review" name="review" rows="5" cols="50" placeholder="Movie Review"></textarea>
<br>
<input type="submit" id="submit" name="submit" value="Submit Review">
<br>
For movie review tips, click <a href="https://www.nyfa.edu/student-resources/9-tips-for-writing-a-film-review/" target="_blank">here</a>


</form>    
</section>
</body>
</html>
